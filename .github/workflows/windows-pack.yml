name: Windows pack

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install renderer dependencies
        working-directory: renderer
        run: npm install
      - name: Read pack version
        id: ver
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          echo "version=$ver" >> $env:GITHUB_OUTPUT
      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF -eq 'refs/heads/master' -and ($env:GITHUB_EVENT_NAME -eq 'push' -or $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch')) {
            npm run dist:win:publish
          } else {
            npm run dist:win
          }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Unitview-Setup-${{ steps.ver.outputs.version }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
